  # OpenAI resource endpoint (https://<resource>.openai.azure.com/).
  CLOUD_LLM_BASE_URL: "https://logos.aet.cit.tum.de/v1"
  CLOUD_LLM_API_KEY: ""
  CLOUD_LLM_INSTRUCTOR_MODEL: "gpt-6.1-sol"   # admin/phd only
